<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><meta name='theme-color' content='#f5f1e8'><title>Stack</title><link rel='manifest' href='manifest.webmanifest'><style>
:root{--bg:#f5f1e8;--card:#fffdf8;--ink:#24231f;--muted:#777269;--line:#ded8cc;--accent:#222;--chip:#eee8dc}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}main{max-width:720px;margin:auto;padding:20px 14px 100px}.top{display:flex;justify-content:space-between;align-items:center}.top h1{font-size:28px;margin:0}.sub{color:var(--muted);font-size:13px}.capture{display:flex;gap:8px;margin:18px 0}.capture input{flex:1;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff;font-size:16px}.btn{border:0;border-radius:14px;padding:12px 14px;background:var(--ink);color:white;font-weight:700;cursor:pointer}.btn.light{background:#e7e0d3;color:var(--ink)}.actions{display:flex;gap:8px;margin-bottom:14px}.actions .btn{flex:1}.filters{display:flex;gap:7px;flex-wrap:wrap;margin:8px 0 12px}.filter{background:var(--chip);border:0;padding:7px 10px;border-radius:999px}.filter.on{background:var(--ink);color:#fff}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:9px 0;box-shadow:0 2px 8px #00000008}.row{display:flex;gap:10px}.handle{cursor:grab;color:#aaa;font-size:20px}.content{flex:1}.title{font-size:17px;font-weight:750}.meta{font-size:12px;color:var(--muted);margin-top:5px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.chip{font-size:11px;font-weight:700;background:var(--chip);padding:5px 8px;border-radius:999px;cursor:pointer}.controls{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}.mini{border:1px solid var(--line);background:white;border-radius:9px;padding:6px 8px;cursor:pointer}.stale{opacity:.55}.empty{text-align:center;color:var(--muted);padding:40px}.overlay{position:fixed;inset:0;background:#f5f1e8;z-index:5;display:none;align-items:center;justify-content:center;padding:25px}.overlay.show{display:flex}.focus{max-width:480px;text-align:center}.focus h2{font-size:30px}.focus .big{background:#fffdf8;border:1px solid var(--line);border-radius:18px;padding:24px;margin:22px 0;font-size:22px;font-weight:800}.focus .btn{margin:5px}.footer{position:fixed;bottom:0;left:0;right:0;background:#f5f1e8ee;border-top:1px solid var(--line);padding:10px;text-align:center;font-size:12px;color:var(--muted);backdrop-filter:blur(8px)}
</style></head><body><main><div class='top'><div><h1>Stack</h1><div class='sub'>Capture it now. Decide what matters later.</div></div><button class='btn light' id='clearFilters'>Clear</button></div><div class='capture'><input id='taskInput' placeholder='What just entered your head?'><button class='btn' id='add'>+ Add</button><button class='btn light' id='mic'>🎙</button></div><div class='actions'><button class='btn' id='whatNow'>What now?</button><button class='btn light' id='fried'>My brain is fried</button></div><div class='filters' id='activeFilters'></div><section id='list'></section></main><div class='overlay' id='overlay'><div class='focus'><div class='sub' id='modeLabel'></div><h2 id='focusHeading'></h2><div class='big' id='focusTask'></div><button class='btn' id='doThis'>START</button><button class='btn light' id='notNow'>NOT NOW ↓</button><button class='mini' id='closeFocus'>I'm done for now</button></div></div><div class='footer'>Everything stays on this device · archived, not deleted</div><script>
const KEY='brainstack-v1'; let state=JSON.parse(localStorage.getItem(KEY)||'{"items":[],"events":[]}'); let filters=[]; let focusId=null; const $=s=>document.querySelector(s); const save=()=>localStorage.setItem(KEY,JSON.stringify(state));
function event(id,type,data={}){state.events.push({id:crypto.randomUUID(),itemId:id,type,at:new Date().toISOString(),...data});}
function period(d=new Date()){let h=d.getHours();return h<6?'late night':h<9?'early morning':h<17?'business hours':h<21?'evening':'late night'}
function infer(text){let t=text.toLowerCase(), tags=[]; const rules=[['family',['mom','dad','son','daughter','family','zoey','riley']],['work',['client','resume','job','meeting','proposal','email']],['health',['doctor','workout','exercise','health','medicine']],['shopping',['buy','shop','order','grocery']],['home',['house','paint','repair','clean','railing']],['entertainment',['watch','movie','game','youtube']],['admin',['call','form','insurance','bill','appointment']]];rules.forEach(([tag,words])=>{if(words.some(w=>t.includes(w)))tags.push(tag)}); if(/today|urgent|asap|now|tomorrow/.test(t))tags.push('soon'); return [...new Set(tags)].slice(0,3)}
function add(text){text=text.trim();if(!text)return; let now=new Date();let item={id:crypto.randomUUID(),text,createdAt:now.toISOString(),lastTouched:now.toISOString(),status:'active',tags:infer(text),period:period(now)};state.items.unshift(item);event(item.id,'CREATE');save();render();}
function active(){return state.items.filter(i=>i.status==='active'&&filters.every(f=>i.tags.includes(f)))}
function ageDays(i){return Math.floor((Date.now()-new Date(i.lastTouched))/86400000)}
function render(){let list=$('#list'),items=active();$('#activeFilters').innerHTML=filters.map(f=>`<button class="filter on" data-filter="${f}">${f} ×</button>`).join('');if(!items.length){list.innerHTML='<div class="empty">Nothing here. Your brain gets a little room.</div>';return}list.innerHTML=items.map((i,idx)=>`<article class="card ${ageDays(i)>30?'stale':''}" draggable="true" data-id="${i.id}"><div class="row"><div class="handle">≡</div><div class="content"><div class="title">${esc(i.text)}</div><div class="meta">Added ${fmt(i.createdAt)} · ${i.period}${ageDays(i)>14?` · ${ageDays(i)} days untouched`:''}</div><div class="chips">${i.tags.map(t=>`<span class="chip" data-tag="${t}">${t.toUpperCase()}</span>`).join('')}</div><div class="controls"><button class="mini" data-act="top">↑ TOP</button><button class="mini" data-act="done">✓ Done</button><button class="mini" data-act="archive">Archive</button></div></div></div></article>`).join('');bindCards()}
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function fmt(s){let d=new Date(s),today=new Date();let day=d.toDateString()==today.toDateString()?'today':d.toLocaleDateString([], {month:'short',day:'numeric'});return `${day} ${d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}`}
function touch(i,type){i.lastTouched=new Date().toISOString();event(i.id,type)}function bindCards(){document.querySelectorAll('.chip').forEach(x=>x.onclick=()=>{let t=x.dataset.tag;filters.includes(t)?filters=filters.filter(f=>f!==t):filters.push(t);render()});document.querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>{let card=b.closest('.card'),id=card.dataset.id,i=state.items.find(x=>x.id===id);if(b.dataset.act==='top'){state.items=state.items.filter(x=>x.id!==id);state.items.unshift(i);touch(i,'PROMOTE')}if(b.dataset.act==='done'){i.status='done';touch(i,'COMPLETE')}if(b.dataset.act==='archive'){i.status='archived';touch(i,'ARCHIVE')}save();render()});let drag=null;document.querySelectorAll('.card').forEach(c=>{c.ondragstart=()=>drag=c.dataset.id;c.ondragover=e=>e.preventDefault();c.ondrop=()=>{if(!drag||drag===c.dataset.id)return;let a=state.items.findIndex(x=>x.id===drag),b=state.items.findIndex(x=>x.id===c.dataset.id),[m]=state.items.splice(a,1);state.items.splice(b,0,m);touch(m,'REORDER');save();render()}})}
function focus(fried=false){let arr=state.items.filter(i=>i.status==='active');if(!arr.length)return;let scored=arr.map((i,index)=>({i,s:(arr.length-index)*2+i.tags.includes('soon')*8+state.events.filter(e=>e.itemId===i.id&&e.type==='PROMOTE').length*4-ageDays(i)*.05})).sort((a,b)=>b.s-a.s);focusId=scored[0].i.id;$('#modeLabel').textContent=fried?'MY BRAIN IS FRIED MODE':'WHAT NOW?';$('#focusHeading').textContent=fried?'Forget the whole stack. Just one thing.':'One thing to move forward:';$('#focusTask').textContent=scored[0].i.text;$('#overlay').classList.add('show')}
$('#add').onclick=()=>{add($('#taskInput').value);$('#taskInput').value=''};$('#taskInput').onkeydown=e=>{if(e.key==='Enter')$('#add').click()};$('#clearFilters').onclick=()=>{filters=[];render()};$('#whatNow').onclick=()=>focus(false);$('#fried').onclick=()=>focus(true);$('#closeFocus').onclick=()=>$('#overlay').classList.remove('show');$('#doThis').onclick=()=>{let i=state.items.find(x=>x.id===focusId);touch(i,'START');save();$('#overlay').classList.remove('show')};$('#notNow').onclick=()=>{let i=state.items.find(x=>x.id===focusId);touch(i,'DEFER');save();$('#overlay').classList.remove('show');focus($('#modeLabel').textContent.includes('FRIED'))};
$('#mic').onclick=()=>{let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){alert('Voice capture is not supported by this browser. You can still type.');return}let btn=$('#mic'),input=$('#taskInput'),r=new SR();r.continuous=false;r.interimResults=true;r.maxAlternatives=1;r.lang=navigator.language||'en-CA';let finalText='';btn.disabled=true;btn.textContent='Listening…';input.placeholder='Listening… speak now';r.onresult=e=>{let interim='';for(let n=e.resultIndex;n<e.results.length;n++){let t=e.results[n][0].transcript;if(e.results[n].isFinal)finalText+=t;else interim+=t}input.value=(finalText+interim).trim();input.focus()};r.onerror=e=>{let msg=e.error==='not-allowed'?'Microphone permission was blocked. Allow microphone access for this site and try again.':e.error==='no-speech'?'I didn’t hear anything. Try again and speak after “Listening…” appears.':'Voice capture stopped: '+e.error;alert(msg)};r.onend=()=>{btn.disabled=false;btn.textContent='🎙';input.placeholder='What just entered your head?';input.focus()};try{r.start()}catch(e){btn.disabled=false;btn.textContent='🎙';alert('Voice capture could not start. Please try again.')}};if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');render();
</script></body></html>
